name: Threads Auto Post

on:
  schedule:
    # 낮 발행: 매일 낮 12시 30분 (한국시간 KST = UTC 03:30) -> 귀연도령 / 청연도령 격일 교차
    - cron: '30 3 * * *'
    # 밤 발행: 매일 밤 10시 00분 (한국시간 KST = UTC 13:00) -> 매일 월영도령
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '테스트할 모드 선택 (auto: 시간대 자동 / wolyeong: 월영 / gwiyeon: 귀연 / cheongyeon: 청연)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - wolyeong
          - gwiyeon
          - cheongyeon

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run post_threads.py
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python post_threads.py
