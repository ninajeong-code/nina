name: Threads Auto Post

on:
  workflow_dispatch: # Actions 탭에서 수동 테스트 실행 가능
  schedule:
    - cron: '0 13 * * *' # 매일 한국 시간 밤 10:00 (UTC 13:00) 자동 실행

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: pip install requests google-genai

      - name: AI 글 생성 및 스레드 발행 실행
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python post_threads.py
